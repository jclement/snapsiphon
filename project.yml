name: SnapSiphon
options:
  bundleIdPrefix: ca.straybits
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Dev defaults — real releases override these at build time via
    # scripts/release.sh (mise run release -- X.Y.Z), which injects the semver,
    # a timestamp build id, and the git hash without dirtying the tree.
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GIT_COMMIT_HASH: "dev"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  SnapSiphon:
    type: application
    platform: iOS
    sources:
      - path: SnapSiphon
        excludes:
          - "Resources/Help.md"
      # Explicit resource entry — xcodegen won't bundle bare .md files on its own.
      - path: SnapSiphon/Resources/Help.md
        buildPhase: resources
    configFiles:
      Debug: SnapSiphon/Config/Signing.xcconfig
      Release: SnapSiphon/Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.straybits.snapsiphon
        INFOPLIST_FILE: SnapSiphon/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  SnapSiphon:
    build:
      targets:
        SnapSiphon: all
    run:
      config: Debug
      # Local StoreKit testing: Debug runs use the bundled .storekit catalog,
      # so the premium purchase works in the simulator / Xcode with no App
      # Store Connect, sandbox account, or network. TestFlight/App Store
      # builds ignore this and hit the real store.
      storeKitConfiguration: SnapSiphon/Config/StoreKit.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
